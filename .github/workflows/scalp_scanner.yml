name: Scalp Scanner
on:
  workflow_dispatch:
  schedule:
    - cron: '25 14 * * 1-5'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
      WEBULL_APP_ID: ${{ secrets.WEBULL_APP_ID }}
      WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
      WEBULL_PAPER_ACCOUNT_ID: ${{ secrets.WEBULL_PAPER_ACCOUNT_ID }}
      DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
      DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scanner
        run: python -m scanner.main
